name: Night Core CI

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'src/**'
      - 'commands/**'
      - 'utils/**'
      - 'test/**'
      - 'package.json'
      - '.env.example'
      - '.github/workflows/night-core-ci.yml'
  pull_request:
    paths:
      - 'index.js'
      - 'src/**'
      - 'commands/**'
      - 'utils/**'
      - 'test/**'
      - 'package.json'
      - '.env.example'
      - '.github/workflows/night-core-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check index.js && node --check src/index.js && node --check src/whatsapp/startupPairing.js
      - name: Boot smoke test from project .env
        env:
          SERVER_PORT: '8799'
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          CORTEX_API_TOKEN=ci-test-token
          OWNER_NUMBER=2348000000000
          WHATSAPP_SESSIONS=main,assistant
          WHATSAPP_ROLE_MODE=split
          WHATSAPP_INBOX_SESSION=main
          WHATSAPP_AI_SESSION=assistant
          WHATSAPP_FALLBACK_ENABLED=true
          PAIRING_SESSION=main
          PAIRING_PHONE_NUMBER=
          EOF
          node index.js > /tmp/night-core.log 2>&1 &
          NIGHT_PID=$!
          trap 'kill $NIGHT_PID || true; cat /tmp/night-core.log' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8799/health >/tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          curl -fsS \
            -H 'Authorization: Bearer ci-test-token' \
            http://127.0.0.1:8799/api/cortex/bootstrap >/tmp/bootstrap.json
          cat /tmp/bootstrap.json
          kill $NIGHT_PID
          wait $NIGHT_PID || true
          trap - EXIT
      - name: Build Bot-Hosting project package
        run: |
          rm -rf /tmp/night-package
          mkdir -p /tmp/night-package
          cp index.js package.json README.md .env.example /tmp/night-package/
          cp -R src commands utils /tmp/night-package/
          cat > /tmp/night-package/BOT_HOSTING_README.txt <<'EOF'
          NIGHT CORE — BOT-HOSTING UPDATE PACKAGE

          UPDATE SAFETY
          - This package intentionally contains NO .env file.
          - This package intentionally contains NO data/ directory.
          - Upload/extract it over an existing Night install without replacing your live .env or saved WhatsApp sessions.

          FIRST INSTALL ONLY
          1. Copy .env.example to .env yourself, then edit that .env.
          2. Set OWNER_NUMBER to your WhatsApp owner number (digits only).
          3. Set CORTEX_API_TOKEN to a long private random value.
          4. Keep WHATSAPP_SESSIONS=main,assistant for the two Night accounts.

          PRE-CORTEX PAIRING TEST
          5. Set PAIRING_SESSION to the slot being tested and PAIRING_PHONE_NUMBER to that WhatsApp number in international digits-only format.
          6. Start/restart Night. If that slot has no saved auth, Night prints one pairing code in the console. If it is already linked, startup pairing is skipped.
          7. After pairing is proven, clear PAIRING_PHONE_NUMBER. Cortex will trigger pairing through the API later.

          HOSTING
          8. Bot-Hosting supplies SERVER_PORT automatically. Do not hard-code the hosted port in .env.
          9. Use index.js as the startup/entry file. No extra arguments are required.

          Never upload session credentials or data/ to GitHub.
          EOF

          # Deployment artifact must never overwrite live secrets or persisted state.
          test ! -e /tmp/night-package/.env
          test ! -e /tmp/night-package/data
          find /tmp/night-package -maxdepth 2 -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: Night_Core_BotHosting
          path: /tmp/night-package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
